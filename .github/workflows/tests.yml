name: ScipionAPI backend tests

on:
  push:
    branches:
      - devel
      - wizard-dialogs-refactor
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scipion_api_test
          POSTGRES_USER: scipion_test
          POSTGRES_PASSWORD: scipion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scipion_test -d scipion_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      valkey:
        image: valkey/valkey:7.2.14
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SCIPIONAPI_TEST_DATABASE_URL: postgresql+psycopg2://scipion_test:scipion_test@localhost:5432/scipion_api_test
      SCIPIONAPI_TEST_DATABASE_NAME: scipion_api_test
      SCIPIONAPI_TEST_DATABASE_USER: scipion_test
      SCIPIONAPI_TEST_DATABASE_PASS: scipion_test
      SCIPIONAPI_TEST_POSTGRES_HOST: localhost
      SCIPIONAPI_TEST_POSTGRES_PORT: "5432"
      BROKER_URL: redis://localhost:6379/0
      RESULT_BACKEND_URL: redis://localhost:6379/0
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: pip check
      - run: pytest
